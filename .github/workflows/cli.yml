name: notbefore-cli
# Build the consumer CLI, run the NOTBEFORE.md §14 acceptance suite against this checkout, and publish to PyPI on a
# `cli-v*` tag (PyPI Trusted Publishing: pending publisher = owner docdailey, repo qrng-beacon-log, workflow cli.yml,
# environment pypi). A missing publisher makes the publish job fail loudly; it never touches the log.
on:
  push:
    branches: [main]
    # every VENDORED source and the Worker: a root-only change to the verifier, keys or expectations must run the vendoring check (R9)
    paths: ["cli/**", ".github/workflows/cli.yml", "verify.py", "tsa.py", "tlog.py", "bls_drand.py", "drand_anchor.py", "schema.py", "keys/**", "ci/anchor_lib.py", "ci/KNOWN_NONCOMPLIANT.json", "hosts/EXPECTED.json", "worker/**"]
    tags: ["cli-v*"]
  pull_request:
    paths: ["cli/**", ".github/workflows/cli.yml", "verify.py", "tsa.py", "tlog.py", "bls_drand.py", "drand_anchor.py", "schema.py", "keys/**", "ci/anchor_lib.py", "ci/KNOWN_NONCOMPLIANT.json", "hosts/EXPECTED.json", "worker/**"]
  workflow_dispatch:
jobs:
  worker:
    name: Decision-log Worker conformance (RFC 6962 vectors, signed notes, statements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install cryptography
      - name: vectors from the Python side, a throwaway PKCS8 key, then the JS side must agree byte for byte
        run: |
          python3 worker/gen_vectors.py > /tmp/vectors.json
          python3 -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K; from cryptography.hazmat.primitives import serialization as S; open('/tmp/k.pem','wb').write(K.generate().private_bytes(S.Encoding.PEM, S.PrivateFormat.PKCS8, S.NoEncryption()))"
          node worker/test_local.mjs /tmp/k.pem /tmp/vectors.json | tee /tmp/out.txt
          ! grep -q "\[FAIL\]" /tmp/out.txt
  test:
    # Deterministic, offline-capable suite on the oldest and newest supported Python, with the pinned test dependency set.
    # fetch-depth 0 brings origin/anchors, which is the offline source of publication evidence for commit-bound contracts.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - name: Tell the hit counter this runner is ours (notbefore.net/stats excludes it)
        run: curl -s -m 8 -4 -o /dev/null -H "X-Self-Token: ${{ secrets.NOTBEFORE_SELF_TOKEN }}" -H "X-Self-Note: github-actions" https://notbefore.net/self-register || true
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install --upgrade pip build && python -m build cli/ --outdir dist/
      - run: python -m pip install -r cli/requirements-test.txt && python -m pip install --no-deps "$(ls dist/*.whl)"
      - name: Vendored verifier matches this checkout
        run: cd cli && python vendor.py && git diff --exit-code --stat -- notbefore/verifier/ ':!notbefore/verifier/VENDORED.json' && echo "vendored files identical to repo root"
      - name: Acceptance suite, offline partition (NOTBEFORE.md §14; no TSA, Rekor, drand or decision-log calls)
        run: NOTBEFORE_OFFLINE=1 NOTBEFORE_LOG_DIR="$GITHUB_WORKSPACE" python -m pytest -q --strict-markers cli/tests -m "not network"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: dist, path: dist/ }
  live:
    # The tests that need live services (RFC 3161 TSAs, Rekor, drand relays). Separate so a third-party outage is attributable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell the hit counter this runner is ours (notbefore.net/stats excludes it)
        run: curl -s -m 8 -4 -o /dev/null -H "X-Self-Token: ${{ secrets.NOTBEFORE_SELF_TOKEN }}" -H "X-Self-Note: github-actions" https://notbefore.net/self-register || true
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip build && python -m build cli/ --outdir dist/ && python -m pip install -r cli/requirements-test.txt && python -m pip install --no-deps "$(ls dist/*.whl)"
      - name: Acceptance suite, live partition
        run: NOTBEFORE_LOG_DIR="$GITHUB_WORKSPACE" python -m pytest -q --strict-markers cli/tests -m network
  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: [test, live, worker]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
