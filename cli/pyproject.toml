[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notbefore"
version = "0.8.1"
description = "NotBefore: verify an hourly commit-then-reveal seed from the public qrng-beacon-log and derive labeled seeds, shuffles and splits from it — with a pinned, vendored verifier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "docdailey" }]
keywords = ["randomness", "beacon", "commit-reveal", "drand", "transparency-log", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42", "py_ecc>=7"]

[project.optional-dependencies]
anchors = ["opentimestamps-client>=0.7"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/docdailey/qrng-beacon-log"
Specification = "https://github.com/docdailey/qrng-beacon-log/blob/main/NOTBEFORE.md"
Log = "https://github.com/docdailey/qrng-beacon-log/tree/main/chain"

[project.scripts]
notbefore = "notbefore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["notbefore"]

[tool.hatch.build.targets.sdist]
include = ["notbefore/**", "README.md", "LICENSE", "pyproject.toml", "vendor.py", "tests/**"]
